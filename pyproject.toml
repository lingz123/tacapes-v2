[project]
name = "tacapes-v2"
version = "0.1.0"
description = "Mission-driven LLM portfolio builder. M2-M4 thesis decomposition + per-ticker TradingAgents research + portfolio constructor."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-postgresql>=6.0",
    "ruff>=0.6",
]

[project.scripts]
tacapes = "tacapes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tacapes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
